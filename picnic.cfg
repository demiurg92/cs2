// picnic.cfg — CS2 portable competitive config
// Mouse baseline: 800 DPI, 1000 Hz polling rate
// Video baseline (set in CS2/driver, not here): 1440x1080, 4:3 stretched, Fullscreen Windowed (tested),
// maximum refresh rate, V-Sync Off, G-SYNC Off, NVIDIA Reflex Enabled.

// =========================
// MOUSE
// =========================
sensitivity "1.3"
zoom_sensitivity_ratio "1.0"

// =========================
// WEAPON SWITCHING
// Q is reserved for Smoke; no previous-weapon / lastinv action.
// =========================
unbind "q"

// =========================
// GRENADES
// 4 = HE, Q = Smoke, F = Flash, C/X = Molotov/Incendiary.
// C and X intentionally duplicate Molotov so either key can be used.
// =========================
bind "4" "slot6"
bind "q" "slot8"
bind "f" "slot7"
bind "c" "slot10"
bind "x" "slot10"

// =========================
// JUMP
// donk-style: both wheel directions trigger jump; Space remains available.
// =========================
bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" "+jump"
bind "SPACE" "+jump"

// =========================
// CROSSHAIR — user-tested best-performing cross (2026-10-16)
// Bright green, no center dot or outline, screenshot: size 3, thickness 2, gap 3.
// Scoped aiming dot: size 1.00, do not use crosshair color.
// =========================
cl_crosshairstyle "4"
cl_crosshairdot "0"
cl_crosshairsize "3"
cl_crosshairthickness "2"
cl_crosshairgap "3"
cl_crosshair_drawoutline "0"
cl_crosshaircolor "5"
cl_crosshaircolor_r "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "130"
cl_crosshairusealpha "1"
cl_crosshairalpha "255"
cl_crosshair_recoil "0"
cl_crosshairgap_useweaponvalue "0"
cl_crosshair_sniper_width "1"

// =========================
// BULLET TRACERS — experiment
// Try first-person bullet tracers enabled (if supported by current CS2 build).
// Note: CS2 may ignore this legacy command; bullet impact decals are separate.
// =========================
r_drawtracers_firstperson "1"

// =========================
// NETWORK
// =========================
// Maximum client bandwidth cap. 786432 = in-game "Unrestricted"; 1000000 = higher manual cap.
rate "1000000"

// =========================
// RADAR
// Competitive wide-view radar: rotating, not player-centered, scale 0.40.
// Shows substantially more of the map than the previous centered 0.70 setup.
// =========================
cl_radar_always_centered "0"
cl_radar_rotate "1"
cl_radar_scale "0.40"
cl_hud_radar_scale "1.0"

// =========================
// VIEWMODEL
// =========================
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "2"
viewmodel_offset_z "-2"

// =========================
// НАСТРОЙКИ ВИДЕО — ВЫСТАВИТЬ ВРУЧНУЮ
// Ориентир: соревновательные настройки в стиле donk.
// Названия параметров приведены для русского интерфейса CS2.
// =========================
// Режим отображения: Полноэкранный в окне (проверенный вариант)
// Соотношение сторон: Обычный 4:3
// Разрешение: 1440x1080
// Частота обновления: 280 Гц на проверенном ПК; яркость 85%
// Повышенный контраст игроков: Включено
// Вертикальная синхронизация: Выключено
// NVIDIA G-SYNC: Выключено
// NVIDIA Reflex Low Latency: Включено
// Максимальная частота кадров в матчах: 300; в меню: 200 (выставить в интерфейсе)
// Режим сглаживания множественной выборкой: 2x MSAA
// Общее качество теней: Среднее
// Динамические тени: Все
// Детализация моделей и текстур: Средняя
// Режим фильтрации текстур: Анизотропная 2x
// Детализация шейдеров: Низкая
// Детализация частиц: Низкая
// Глобальное затенение: Выключено
// Расширенный динамический диапазон: Качество
// FidelityFX Super Resolution: Выключено
//
// ВАЖНО: растяжка 4:3 (stretched) обычно задаётся масштабированием
// в драйвере видеокарты/настройках дисплея, а не этой cfg.

// =========================
// AUDIO — ВЫСТАВИТЬ ВРУЧНУЮ
// Competitive spatial-audio baseline (donk-style / common pro pattern).
// =========================
// Основная громкость: по комфорту
// Профиль эквалайзера (EQ Profile): Natural
// Изоляция левого/правого каналов (L/R Isolation): 0%
// Коррекция перспективы (Perspective Correction): Включено
// Музыка начала раунда: 0%
// Музыка действия раунда: 0%
// Музыка конца раунда: 0%
// Музыка MVP: 0%
// Музыка бомбы/заложника: 10%
// Предупреждение за 10 секунд: 20%
// Музыка камеры смерти: 0%
// В Windows/ПО гарнитуры: Stereo; виртуальный 7.1 / Surround выключить.

// =========================
// NOTES
// =========================
// Video/monitor settings are intentionally NOT forced by this cfg.
// On a club PC, verify manually:
// 1) Mouse = 800 DPI / 1000 Hz
// 2) Windows = maximum monitor refresh rate
// 3) CS2 = 1440x1080 / 4:3 / stretched / Fullscreen Windowed (tested)
// 4) V-Sync Off / G-SYNC Off / NVIDIA Reflex Enabled
// Then open the CS2 console and run: exec picnic

echo "picnic.cfg loaded"